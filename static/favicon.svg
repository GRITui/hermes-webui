      <stop offset="0" stop-color="#08EBF1"/>
      <stop offset="1" stop-color="#3889FD"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#141a2e"/>
      <stop offset="100%" stop-color="#0D0D1A"/>
